<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід у CRM | ELENIKO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#1A1A1A', light: '#FDFBF7', gold: '#C5A880', accent: '#8E7B61', gray: '#E5E0D8' }
                    },
                    fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light font-sans h-screen flex items-center justify-center p-4 selection:bg-brand-gold selection:text-white">

    <div class="w-full max-w-md bg-white p-10 shadow-2xl border border-brand-gray relative overflow-hidden">
        <div class="absolute top-0 right-0 w-20 h-20 bg-brand-gold/10 -mr-10 -mt-10 rounded-full"></div>
        
        <div class="text-center mb-10 relative z-10">
            <div class="flex items-center justify-center gap-2 mb-4">
                <i data-lucide="scissors" class="h-8 w-8 text-brand-gold"></i>
            </div>
            <h1 class="font-serif text-3xl tracking-widest font-semibold uppercase text-brand-dark">eleniko</h1>
            <p class="text-xs uppercase tracking-widest text-brand-accent mt-2">Панель адміністратора</p>
        </div>

        {% if error %}
        <div class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 flex items-center gap-3">
            <i data-lucide="alert-circle" class="w-5 h-5 text-red-500"></i>
            <p class="text-sm text-red-700">{{ error }}</p>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-6 relative z-10">
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Логін</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-brand-gold"></i>
                    <input type="text" name="username" required class="w-full pl-12 pr-4 py-4 bg-brand-light border border-brand-gray focus:outline-none focus:border-brand-gold transition-colors text-sm" placeholder="Введіть логін">
                </div>
            </div>
            
            <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Пароль</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-brand-gold"></i>
                    <input type="password" name="password" required class="w-full pl-12 pr-4 py-4 bg-brand-light border border-brand-gray focus:outline-none focus:border-brand-gold transition-colors text-sm" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full bg-brand-dark text-white py-4 text-sm uppercase tracking-widest hover:bg-brand-gold transition-colors shadow-lg mt-4">
                Увійти в систему
            </button>
        </form>
        
        <div class="mt-8 text-center">
            <a href="{{ url_for('index') }}" class="text-sm text-gray-400 hover:text-brand-dark transition-colors inline-flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Повернутися на сайт
            </a>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
